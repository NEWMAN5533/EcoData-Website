<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EcoData</title>


    <!--remix icons-->
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
 
 

  <link rel="stylesheet" href="sign.css">
 <link rel="stylesheet" href="newSignUp.css">


  <style>
    


  .btn-text{
    font-size: .95rem;
    font-weight: 600;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }


  .spinner{
    width: 19px;
    height: 19px;
    border: 3px solid white;
    border-top: 3px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
  }

  button.loading .spinner{
    display: block;
  }

  button.loading .btn-text{
    display: none;
  }


  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }



  </style>
</head>


<body>


   <div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!----LAPTOP & PHONE UI-UPDATE (9TH-MAY)---->

<div class="signUp-container">
  <!----navbar--->
  <div class="navigation">
    <div class="navigation-left">
      <img src="./css/icons/newLogo.png" alt="" loading="lazy">
    </div>



    <div class="right-nav">
      <button type="button" 
      class='signup-theme-toggle' 
      id="signupThemeToggle" 
      aria-label="Toggle dark mode" 
      aria-pressed="false">
      
        <span class="theme-toggle-icon theme-sun">
          <i class="ri-sun-line"></i>
        </span>

        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>

        <span class="theme-toggle-icon theme-moon">
            <!---theme button -->
        <i class="ri-moon-foggy-line change-theme material-icons" ></i>
        </span>

      </button>

    </div>
  </div>
    <div class="grid-container">



      <!--SIDEBAR-->
      <div class="sidebar" >
       <div class="sidebar-signup-card">
        
        
       
       </div>
      
        <div class="buy-sell-note">
        <h2>
          Get your account ready to buy & sell at the same time.
        </h2>
        <i class="ri-shopping-bag-3-line"></i>
       </div>
      </div>


<!----main-man-->
      <div class="main-main">



       


    <!---NEW SIGN-UP-->
  <div class="signup-card">


        <!-- ICON -->

        <div class="signup-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M16 21v-2
                 a4 4 0 0 0-4-4H6
                 a4 4 0 0 0-4 4v2"
            />

            <circle
              cx="9"
              cy="7"
              r="4"
            />

            <line
              x1="19"
              y1="8"
              x2="19"
              y2="14"
            />

            <line
              x1="22"
              y1="11"
              x2="16"
              y2="11"
            />

          </svg>

        </div>



        <!-- HEADING -->

        <div class="signup-heading">

          <p class="signup-eyebrow">
            EcoDataStore ACCOUNT
          </p>

          <h1>
            Welcome back!
          </h1>

          <p>
            Login to your account to manage your
            orders, downloads, wishlist and more.
          </p>

        </div>



        <!-- MESSAGE -->

        <div
          id="signupMessage"
          class="signup-message"
          role="alert"
          aria-live="polite"
        ></div>



        <!-- FORM -->

        <form
          id="loginForm"
          novalidate
        >


          <!-- NAME -->

          <div class="form-row">

            <div class="form-group">

              <label
                for="loginEmail"
              >
                Email Address
              </label>

              <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="Email"
                autocomplete="email"
                required
              >

            </div>


         
          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <label
              for="loginPassword"
            >
              Password
            </label>

            <div class="input-wrapper">

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <rect
                  x="3"
                  y="11"
                  width="18"
                  height="10"
                  rx="2"
                />

                <path
                  d="M7 11V7a5 5 0 0 1 10 0v4"
                />

              </svg>


              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
              >


              <button
                type="button"
                id="loginPasswordToggle"
                class="password-toggle"
                aria-label="Show password"
              >

                <svg
                  class="eye-open"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <path
                    d="M2 12s3.5-7 10-7
                       10 7 10 7-3.5 7-10 7
                       S2 12 2 12Z"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                  />

                </svg>


                <svg
                  class="eye-closed"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <path
                    d="m3 3 18 18"
                  />

                  <path
                    d="M10.6 5.1
                       A10.7 10.7 0 0 1 12 5
                       c6.5 0 10 7 10 7
                       a17.7 17.7 0 0 1-3.2 4.1"
                  />

                  <path
                    d="M6.2 6.2
                       C3.5 8.2 2 12 2 12
                       s3.5 7 10 7
                       c1.5 0 2.8-.3 4-.8"
                  />

                </svg>

              </button>

            </div>




          </div>


          



  


          <!-- SUBMIT -->

          <div id="clerk-captcha"></div>

          <button
            type="submit"
            id="userSignupButton"
            class="signup-button"
          >

        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Login</span>


          </button>

        </form>



        <!-- DIVIDER -->

        <div class="signup-divider">
          <span>or</span>
        </div>



        <!-- LOGIN -->

        <p class="signup-footer-text">

          Don't have an EcoData account?

          <a href="./signUp.html">
            Sign up
          </a>

        </p>



        <!-- SELLER -->

        <a
          href="seller-signup.html"
          class="seller-cta"
        >

          <span>
            Want to sell on EcoData Store?
          </span>

          <strong>
            Become a seller
          </strong>

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <line
              x1="5"
              y1="12"
              x2="19"
              y2="12"
            />

            <polyline
              points="12,5 19,12 12,19"
            />

          </svg>

        </a>


      </div>
  <!---NEW SIGN-UP-->



   
      




      </div>
</div>

</script>

</body>
</html>
